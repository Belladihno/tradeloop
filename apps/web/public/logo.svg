<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" fill="none">
  <!-- Tradeloop Brand Mark: Interlocking Escrow Loop -->
  <g transform="translate(10, 10)">
    <!-- Outer Shield / Vault ring gradient -->
    <defs>
      <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#0D6E6E"/>
        <stop offset="100%" stop-color="#095555"/>
      </linearGradient>
      <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#F5B031"/>
        <stop offset="100%" stop-color="#E8A020"/>
      </linearGradient>
    </defs>

    <!-- Left Loop (Teal: Marketplace & Stability) -->
    <path d="M 30 14 C 18 14 10 22 10 30 C 10 38 18 46 30 46 C 42 46 50 38 58 30 C 50 22 42 14 30 14 Z"
          stroke="url(#tealGrad)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

    <!-- Right Loop (Amber: Value & Escrow release) -->
    <path d="M 46 14 C 58 14 66 22 66 30 C 66 38 58 46 46 46 C 34 46 26 38 18 30 C 26 22 34 14 46 14 Z"
          stroke="url(#amberGrad)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

    <!-- Central Escrow Keyhole / Shackle accent -->
    <circle cx="38" cy="30" r="3.5" fill="#0D6E6E" />
    <path d="M 38 33.5 L 38 38" stroke="#0D6E6E" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- Wordmark -->
  <text x="96" y="47" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="28" font-weight="800" fill="#1A1A1A" letter-spacing="-0.75">Trade<tspan fill="#0D6E6E">loop</tspan></text>
  <text x="97" y="59" font-family="'Inter', system-ui, sans-serif" font-size="9" font-weight="600" fill="#E8A020" letter-spacing="1.8">ESCROW MARKETPLACE</text>
</svg>
